# Free trial only. Public uploads on free instances are ephemeral.
# Review current provider limits before using any real business data.
databases:
  - name: dar-al-khashab-trial-db
    plan: free
    databaseName: dar_trial
    user: dar_trial
services:
  - type: web
    name: dar-al-khashab-trial
    runtime: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DEBUG
        value: "0"
      - key: TRUST_PROXY
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: STORE_SETUP_TOKEN
        generateValue: true
      - key: SERVE_PUBLIC_UPLOADS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: dar-al-khashab-trial-db
          property: connectionString
