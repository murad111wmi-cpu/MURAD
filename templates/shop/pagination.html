{% load store_tags %}{% if page.has_other_pages %}<nav class="pagination" aria-label="Pagination">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&q={{ q|urlencode }}&category={{ selected_category|urlencode }}">{% tr 'السابق' 'Previous' %}</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&q={{ q|urlencode }}&category={{ selected_category|urlencode }}">{% tr 'التالي' 'Next' %}</a>{% endif %}</nav>{% endif %}
