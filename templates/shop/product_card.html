{% load static store_tags %}<article class="product-card"><a href="{% url 'product' product.pk %}" class="product-photo">{% if product.main_image %}<img src="{{ product.main_image.image.url }}" alt="{% label product %}" loading="lazy">{% else %}<div class="image-placeholder" aria-hidden="true">⌑</div>{% endif %}{% if not product.available %}<span class="tag">{% tr 'غير متاح' 'Unavailable' %}</span>{% endif %}</a><div class="product-info"><div>{% if product.category %}<small>{% label product.category %}</small>{% endif %}<h3><a href="{% url 'product' product.pk %}">{% label product %}</a></h3></div><span class="price">{{ product.price|money:store.currency }}</span></div></article>
