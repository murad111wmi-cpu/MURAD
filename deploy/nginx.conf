server {
    listen 80;
    server_name _;
    client_max_body_size 26m;
    # Only Caddy (public port 443) or a trusted TLS proxy may set these headers.
    # Caddy controls forwarded client addresses; only private proxy subnets are trusted.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    location /static/ { alias /srv/static/; expires 7d; add_header X-Content-Type-Options nosniff; }
    location /media/images/ { alias /srv/media/images/; add_header X-Content-Type-Options nosniff; }
    location /media/ { return 404; }
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
    }
}
