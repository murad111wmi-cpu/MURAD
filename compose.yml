services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dar
      POSTGRES_USER: dar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dar -d dar"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "0"
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://dar:${POSTGRES_PASSWORD}@db:5432/dar
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose: ["8000"]
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [public]
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  postgres_data:
  media:
  static:
  caddy_data:
  caddy_config:
